spring:
  application:
    name: scaffold-admin
  profiles:
    active: dev
  jackson:
    # 数据库连接把会话时区强制成 +08:00，Jackson 默认按 UTC 序列化 java.util.Date
    # 会让日期整体早 8 小时（跨天的字段如注册日期会少一天），必须与会话时区对齐
    time-zone: ${JSON_TIMEZONE:GMT+8}

server:
  port: 8080

scaffold:
  api-prefix: /api
  jwt:
    secret: "${JWT_SECRET}"
    expires-seconds: 7200
  security:
    captcha:
      # 关闭时登录不再校验图形验证码（集成测试用），生产保持开启
      enabled: ${CAPTCHA_ENABLED:true}
  # scaffold:platform-only:start 低代码平台自身的运行参数，交付项目里整段裁掉
  lowcode:
    # 项目工作区根目录：容器里指向工作区卷，本地开发默认 ./lowcode-workspace
    workspace-root: ${LOWCODE_WORKSPACE_ROOT:./lowcode-workspace}
    # 底座源码 checkout：留空时从当前目录向上找 scaffold-system/pom.xml + scaffold-vue/package.json
    scaffold-source-root: ${LOWCODE_SCAFFOLD_SOURCE_ROOT:}
    # 写进交付项目 package.json 的 @yuanda-lowcode-ai/scaffold-ui 依赖写法：发布到 npm 后就是版本号；
    # 本地演练交付链时可以临时改成 file:../packages/scaffold-ui 之类的路径，不用改代码
    scaffold-ui-version: ${LOWCODE_SCAFFOLD_UI_VERSION:^1.0.0}
    git:
      timeout-seconds: 120
      commit-name: 元搭平台
      commit-email: platform@yuanda.local
      # SSH 主目录：默认取进程用户的 HOME，容器里需要挂 ~/.ssh（含密钥与 known_hosts）
      ssh-home: ${LOWCODE_GIT_SSH_HOME:}
  # scaffold:platform-only:end

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
