services:
  mysql:
    image: mysql:8.0
    profiles: ["mysql"]          # 启用方式：docker compose --profile mysql up -d
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-scaffold_system}
      TZ: Asia/Shanghai
    command:
      # 初始化 SQL 不写 CHARSET/COLLATE，建表结果继承这里的库默认字符集
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次导入 SQL 时强制客户端按 utf8mb4 解析，避免中文二次编码入库
      - ./deploy/mysql-client.cnf:/etc/mysql/conf.d/scaffold-client.cnf:ro
      # 空库首次启动时按文件名顺序自动导入初始化脚本
      - ./scaffold-system/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./scaffold-system
    image: scaffold-backend:latest
    restart: unless-stopped
    # Linux 宿主机复用外部 MySQL 时，DB_HOST=host.docker.internal 依赖该映射
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-scaffold_system}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_TIMEZONE: ${DB_TIMEZONE:-+08:00}
      JSON_TIMEZONE: ${JSON_TIMEZONE:-GMT+8}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      # scaffold:platform-only:start 低代码平台侧参数，交付项目里这一段会被裁掉
      LOWCODE_WORKSPACE_ROOT: /var/lib/yuanda/workspace
      LOWCODE_SCAFFOLD_SOURCE_ROOT: /var/lib/yuanda/scaffold-src
      LOWCODE_GIT_SSH_HOME: /root
      # scaffold:platform-only:end
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      # mysql 在 profile 里：启用时后端等它就绪，复用外部库时该依赖自动跳过
      mysql:
        condition: service_healthy
        required: false
    # scaffold:platform-only:start 低代码平台的工作区与构建缓存：项目 clone、底座 checkout、
    # Maven 与 npm 缓存、主机 SSH 密钥。交付项目里后端不需要任何挂载，整段裁掉。
    volumes:
      - lowcode-workspace:/var/lib/yuanda/workspace
      # 底座源码 checkout：交付快照按裁剪清单从这份代码里读，只读挂载
      - ${LOWCODE_SCAFFOLD_SRC:-./}:/var/lib/yuanda/scaffold-src:ro
      - maven-repo:/root/.m2/repository
      - npm-cache:/root/.npm
      # 仓库凭据走主机密钥：私钥需无口令或经 ssh-agent，known_hosts 必须预置目标主机指纹
      - ${LOWCODE_SSH_DIR:-/root/.ssh}:/root/.ssh:ro
      # scaffold:platform-only:end
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      # 上下文是仓库根：npm workspaces 要把 packages/scaffold-ui 一起交给镜像构建
      context: .
      dockerfile: scaffold-vue/Dockerfile
    image: scaffold-frontend:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  # scaffold:platform-only:start 平台侧持久卷：工作区丢了可以从「clone + 全量重生成」重建，但构建缓存丢了每次生成都要全量重下依赖
  lowcode-workspace:
  maven-repo:
  npm-cache:
  # scaffold:platform-only:end
